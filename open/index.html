<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1630" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>giftwrap</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='12' width='24' height='17' rx='2' fill='%23c8102e'/%3E%3Crect x='3' y='8' width='26' height='6' rx='1.5' fill='%23e3313f'/%3E%3Crect x='14' y='8' width='4' height='21' fill='%23f2c14e'/%3E%3Cpath d='M16 8c-2-5-8-5-7-2s5 2 7 2zM16 8c2-5 8-5 7-2s-5 2-7 2z' fill='%23f2c14e'/%3E%3C/svg%3E" />
  </head>
  <body class="open">
    <main>
      <canvas id="scene" class="scene" tabindex="0" aria-label="Wrapped gift. Pull the bow, then tear the paper. Space or Enter works too."></canvas>
      <div id="tag" class="tag" hidden></div>
      <section id="reveal" class="reveal" hidden aria-live="polite">
        <div class="names" id="names"></div>
        <h1 id="title" hidden></h1>
        <img id="image" alt="" hidden referrerpolicy="no-referrer" decoding="async" />
        <div class="code-row" id="code-row" hidden>
          <div class="code" id="code"></div>
          <button class="icon-btn" id="copy" type="button" aria-label="Copy code" title="Copy"></button>
        </div>
        <div class="actions">
          <button class="icon-btn" id="replay" type="button" aria-label="Wrap it again" title="Again"></button>
          <a class="icon-btn" id="make" href="../" aria-label="Wrap a gift" title="Wrap a gift"></a>
        </div>
      </section>
      <div id="message" class="message" hidden role="alert"></div>
    </main>
    <script type="module" src="/src/open/main.ts"></script>
  </body>
</html>
